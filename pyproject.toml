[project]
name = "hil-harness"
version = "0.1.0"
description = "Agent Harness for Hardware-in-the-Loop: instrument control exposed to Python, CLI, and agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hsuan Han Lai" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
visa = ["pyvisa>=1.14"]
usb = ["python-usbtmc>=0.8", "pyusb>=1.2"]
all = ["hil-harness[serial,visa,usb]"]
dev = ["pytest>=8.0", "hil-harness[serial]"]

[project.scripts]
hil = "hil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

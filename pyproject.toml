[project]
name = "hil-harness"
version = "0.1.0"
description = "Agent Harness for Hardware-in-the-Loop: instrument control exposed to Python, CLI, and agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hsuan Han Lai" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
visa = ["pyvisa>=1.14"]
usb = ["python-usbtmc>=0.8", "pyusb>=1.2"]
# ATK-Logic analyzer (logic://usb): pure-Python in-process backend (vendored MIT
# core). Needs pyusb here + the native libusb runtime (a system package — install
# with `hil setup alientek-atk-logic`, or `brew/apt/dnf install libusb`).
atk = ["pyusb>=1.2"]
# PPK2 backend is GPLv2 and user-installed; HIL's MIT core only wraps it.
ppk2 = ["ppk2-api>=0.9"]
# MCP server (`hil mcp`): expose HIL's tools to coding agents (Claude Code, Codex,
# Cursor, …) over stdio/loopback. Works with mcp 1.x (FastMCP) and 2.x (MCPServer).
mcp = ["mcp>=1.2"]
all = ["hil-harness[serial,visa,usb,atk,mcp]"]
dev = ["pytest>=8.0", "hil-harness[serial,mcp]"]

[project.scripts]
hil = "hil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

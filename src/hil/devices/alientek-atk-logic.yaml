slug: alientek-atk-logic
manufacturer: ALIENTEK
model: ATK-Logic
category: logic-analyzer
driver: logic                   # non-SCPI: routed to hil.drivers.logic
description: >
  ALIENTEK logic analyzer (MCU/FPGA over USB, VID:PID 1A86:FFCC). Not SCPI. Driven
  *in-process* by HIL's vendored MIT core (hil._vendor.atklogic) over logic://usb —
  no capture daemon and no GPL boundary. Captures are file-backed artifacts (.atkdl
  by default, or csv/raw) and protocol decode uses a pure-Python sigrok host. A
  separate JSON-RPC capture daemon (logic://host:port) is also still supported.
interfaces: [usb]
connection_examples:
  - logic://usb                   # in-process backend (vendored MIT core; no daemon)
  - logic://usb?serial=ATK22      # ...selecting one analyzer by serial
  - logic://127.0.0.1:5555        # alternative: local JSON-RPC capture daemon
capabilities:
  - logic-capture
  - hardware-trigger
  - protocol-decode
  - stream-to-disk
safety:
  # Informational envelope for the analyzer; keep captures inside it.
  limits:
    channels: 1..16
    sample_rate: 1..200000000 Hz
commands:
  - name: set-channels
    syntax: ':CONF:CHAN <n|list>'
    description: Enable channels — a count (e.g. 8) or an index list (e.g. 0,1,2,3).
    subsystem: CONFigure
    parameters: '<n|list> = channel count or comma/space-separated indices'
  - name: set-sample-rate
    syntax: ':CONF:RATE <hz>'
    description: Set the sample rate in hertz.
    parameters: '<hz> sample rate, e.g. 1000000'
  - name: set-depth
    syntax: ':CONF:DEPTH <samples>'
    description: Capture depth in samples (alternative to a duration).
  - name: set-duration
    syntax: ':CONF:DUR <seconds>'
    description: Capture duration in seconds (alternative to a depth).
  - name: set-format
    syntax: ':CONF:FORM <fmt>'
    description: Fetch format for the capture artifact.
    parameters: '<fmt> = atkdl | csv | srzip | raw  (srzip is served as .atkdl)'
  - name: set-trigger-channel
    syntax: ':TRIG:CHAN <n>'
    description: Trigger on channel n.
  - name: set-trigger-level
    syntax: ':TRIG:LEV <0|1>'
    description: Trigger level (0 or 1).
  - name: set-trigger-edge
    syntax: ':TRIG:EDGE <R|F>'
    description: Trigger edge — R (rising) or F (falling).
  - name: set-trigger-position
    syntax: ':TRIG:POS <pct>'
    description: Trigger position within the buffer, in percent (0..100).
  - name: arm-capture
    syntax: ':ACQ:ARM'
    description: Configure and arm the capture (alias :INIT:ACQ).
  - name: wait-capture
    syntax: ':ACQ:WAIT'
    description: Block until the armed capture completes (trigger + fill).
  - name: stop-capture
    syntax: ':ACQ:STOP'
    description: Abort/stop the current capture (alias :MEAS:STOP).
  - name: capture-state
    syntax: ':ACQ:STAT?'
    query: true
    description: Current state — idle | armed | capturing | triggered | done | error.
  - name: fetch-capture
    syntax: ':FETCh?'
    query: true
    description: Fetch the last capture; returns the artifact file path.
  - name: decode
    syntax: ':DEC <name>?'
    query: true
    description: Run a protocol decoder over the last capture; returns the decoded path.
    parameters: '<name> = a sigrok decoder (pure-Python host), e.g. i2c | spi | uart'

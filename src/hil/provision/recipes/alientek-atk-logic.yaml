# Provisioning recipe: ALIENTEK ATK-Logic-Analyzer (in-process USB backend).
#
# The logic-analyzer driver (hil.drivers.logic) drives the ATK-Logic-Analyzer
# *in-process* through HIL's vendored MIT core (hil._vendor.atklogic: atkproto +
# atkdl + srdhost) — there is NO capture daemon and NO native build. The only
# optional dependencies are `pyusb` and the native `libusb` runtime it needs;
# protocol decode additionally wants a directory of sigrok decoders. Pure Python,
# so there is nothing to compile or cross-compile.
#
#   pip install -e '.[atk]'                 # cold start: HIL + pyusb (the managed extra)
#   hil setup alientek-atk-logic            # or install pyusb via HIL (libusb step is gated)
#   hil setup alientek-atk-logic --yes      # ...and allow the privileged libusb install
#   hil setup alientek-atk-logic --dry-run  # print the plan, run nothing
slug: alientek-atk-logic
driver: logic
description: >
  ALIENTEK ATK-Logic-Analyzer backend (USB 1A86:FFCC) — driven in-process by HIL's
  vendored MIT core. Needs only `pyusb` + the native `libusb` runtime; protocol
  decode additionally wants a sigrok decoders dir. Pure-Python install; no build.
license: MIT
homepage: https://github.com/hugelzhang/atk-logic-mcp

# The backend is ready when pyusb imports (the vendored core always ships with HIL).
# Device presence is a runtime check, not a provisioning one — use `hil atklogic info`.
detect:
  - python_import: usb

steps:
  - id: pip-pyusb
    name: Install pyusb (USB access for the vendored ATK-Logic core)
    pip:
      packages: [pyusb]        # version pin lives in pyproject.toml's `atk` extra;
                               # the engine uses `uv pip` in pip-less (uv) venvs

  - id: libusb
    name: Install libusb (native USB runtime for pyusb)
    privileged: true          # system package -> gated behind --yes
    optional: true            # many OSes/wheels already provide it
    system:
      macos:
        brew: [libusb]
      linux:
        apt-get: [libusb-1.0-0-dev]
        dnf: [libusb1-devel]
        pacman: [libusb]
        zypper: [libusb-1_0-devel]
      windows:
        choco: [libusb]

verify:
  - python_import: usb

notes: >
  Connect in-process with `hil connect logic://usb` (optionally
  `logic://usb?serial=ATK22&decoders=/path&libusb=/path`), or use the dedicated CLI
  `hil atklogic {info,list,capture,decode,convert}` (every command speaks --json).
  Confirm the analyzer is attached with `hil atklogic info` (reports USB 1A86:FFCC,
  serial, 16 channels, <=200 MS/s). libusb is auto-discovered on macOS
  (`brew install libusb`) and Linux; set $ATK_LIBUSB_DLL to override. Protocol
  decode needs a sigrok decoders dir — set $ATK_DECODERS_DIR (or pass --decoders);
  on macOS the ATK-Logic.app bundle already ships one. Capture needs no daemon:
  pyusb + libusb are imported lazily, so `import hil` never requires them.
  `hil setup logic` resolves to this same recipe (driver: logic).

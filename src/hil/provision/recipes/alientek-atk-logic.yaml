# Provisioning recipe: ALIENTEK ATK-Logic capture daemon.
#
# The logic-analyzer driver (hil.drivers.logic) is a thin MIT JSON-RPC client; the
# actual capture + decode runs in a separate GPLv3 daemon built from the atk-logic
# Qt project. This recipe installs the native build toolchain, clones the sources,
# and (best-effort) builds the daemon and its decode library. It is cross-compile
# aware: the .pro carries win32/macx/unix/android(NDK) scopes.
#
#   hil setup alientek-atk-logic --dry-run   # print the whole plan, run nothing
#   hil setup alientek-atk-logic --yes        # install native deps + clone + build
#   HIL_CROSS_TARGET=android-arm64 hil setup alientek-atk-logic --yes
slug: alientek-atk-logic
driver: logic
description: >
  ALIENTEK ATK-Logic capture daemon — a GPLv3 Qt/libusb native build (with
  atk_libsigrokdecode for protocol decode). Requires a C++ toolchain; clones and
  compiles on demand. Cross-compiles per the .pro platform scopes.
license: GPLv3
homepage: https://github.com/adwuard/atk-logic
workdir: atk-logic

# "Ready" means the capture daemon is actually listening (end-to-end usable).
detect:
  - daemon:
      address: "logic://127.0.0.1:5555"
      describe: "capture daemon reachable on logic://127.0.0.1:5555"

steps:
  - id: toolchain
    name: Install the Qt / libusb / glib / python3 build toolchain
    privileged: true
    system:
      macos:
        brew: [qt@5, libusb, glib, pkg-config, python@3.13]
      linux:
        apt-get: [qtbase5-dev, qtdeclarative5-dev, qtquickcontrols2-5-dev,
                  libusb-1.0-0-dev, libglib2.0-dev, pkg-config, python3-dev,
                  build-essential]
        dnf: [qt5-qtbase-devel, qt5-qtdeclarative-devel, libusb1-devel,
              glib2-devel, pkgconf-pkg-config, python3-devel, gcc-c++, make]
      windows:
        choco: [qt5-base, libusb, pkgconfiglite, python3]

  - id: check-toolchain
    name: Confirm git + a C++ compiler + qmake are present
    needs: [git]
    shell:
      default: >
        git --version && pkg-config --version &&
        { qmake --version || qmake6 --version; } &&
        { c++ --version || g++ --version || clang --version; }

  - id: clone
    name: Clone the atk-logic sources
    needs: [git]
    git:
      repo: https://github.com/adwuard/atk-logic.git
      dest: src
      rev: main
      depth: 1

  - id: decode-lib
    name: Check for atk_libsigrokdecode (protocol decode; capture works without it)
    optional: true
    shell:
      default: >
        if pkg-config --exists libsigrokdecode || [ -e "$HOME/Desktop/atk-libs/lib/libsigrokdecode"* ] ||
        [ -e "$HOME/Desktop/atk-libs/lib/atk_decoder.o" ]; then
        echo "decode libs found"; else
        echo "decode libs not present -> capture-only build (decode is phase P3);";
        echo "see docs/logic-daemon-protocol.md for atk_libsigrokdecode + glib + python3-embed"; fi

  - id: build-daemon
    name: Build the ATK-Logic daemon (qmake + make)
    optional: true
    heavy: true          # a long native compile: never started implicitly (auto mode)
    needs: [make]
    shell:
      default: >
        cd src && { qmake ATK-Logic.pro || qmake6 ATK-Logic.pro; } &&
        make -j"$( (nproc 2>/dev/null) || sysctl -n hw.ncpu 2>/dev/null || echo 4 )" ||
        echo "build incomplete: the headless --server target and/or decode libs are pending (see notes)"

verify:
  - daemon:
      address: "logic://127.0.0.1:5555"
      describe: "capture daemon reachable on logic://127.0.0.1:5555"

notes: >
  The headless `--server` JSON-RPC entry (docs/logic-daemon-protocol.md, phase P1)
  is future C++ work in the atk-logic repo, and decode needs atk_libsigrokdecode +
  glib + python3-embed (phase P3). Until the daemon `--server` build exists and is
  launched, the `daemon` verify probe stays red: `hil setup` will have installed
  the toolchain and cloned the sources, but capture/decode over `logic://` needs
  that running daemon. Cross-compiling (e.g. Android) is driven by the .pro scopes
  — set HIL_CROSS_TARGET and the matching ATK_ANDROID_LIBUSB prefix. Everything up
  to the daemon runs hardware-free on HIL's simulator (`hil bench run` with no
  --address), so bench flows are testable before the daemon ships.
